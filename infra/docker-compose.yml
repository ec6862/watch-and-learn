name: wal

services:
  postgres:
    image: postgres:18-alpine
    container_name: wal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wal_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-watch_and_learn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
